name: Staging Deployment

on:
  workflow_call:
    inputs:
      version:
        description: 'SemVer container image tag'
        required: true
        type: string
      release_id:
        description: 'GitHub Release ID to publish as pre-release candidate'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  actions: write

jobs:
  staging-plan:
    name: "🎯 Staging: Kustomize Plan (Dry Run)"
    runs-on: infra
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          clean: true

      - name: Preview Staging Manifests with Version
        run: |
          DOCKER_USER="${{ vars.DOCKER_USERNAME || 'shubhszone' }}"
          echo "=== Previewing Staging Manifests for ${{ inputs.version }} ==="
          cd k8s/overlays/staging
          kustomize edit set image taskforge=${DOCKER_USER}/taskforge:${{ inputs.version }}
          kubectl kustomize .

  staging-approval:
    name: "🎯 Staging: Promotion Approval Gate"
    needs: staging-plan
    runs-on: ubuntu-latest
    environment:
      name: approval-staging
    steps:
      - name: Staging Promotion Approved
        run: |
          echo "Approved promotion of version ${{ inputs.version }} to Staging."

  deploy-staging:
    name: "🎯 Staging: Promote to Staging"
    needs: staging-approval
    runs-on: infra
    environment:
      name: staging
    env:
      DEPLOY_ENV: staging
      NAMESPACE: taskforge-staging
      DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME || 'shubhszone' }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      TARGET_VERSION: ${{ inputs.version }}
      RELEASE_ID: ${{ inputs.release_id }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          clean: true

      - name: Ensure Staging Namespace Exists
        run: kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Inject Kubernetes Secrets
        run: |
          kubectl create secret generic taskforge-secrets \
            --namespace=${{ env.NAMESPACE }} \
            --from-literal=POSTGRES_PASSWORD="${{ env.POSTGRES_PASSWORD }}" \
            --from-literal=DATABASE_URL="postgres://taskforge:${{ env.POSTGRES_PASSWORD }}@postgres:5432/taskforge" \
            --from-literal=REDIS_URL="redis://redis:6379" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Set Staging Overlay Image Tag to EXACT Same SemVer
        run: |
          cd k8s/overlays/${{ env.DEPLOY_ENV }}
          kustomize edit set image taskforge=${{ env.DOCKER_USERNAME }}/taskforge:${{ env.TARGET_VERSION }}

      - name: Deploy to Staging
        run: |
          kubectl apply -k k8s/overlays/${{ env.DEPLOY_ENV }}

      - name: Verify Staging Rollout with Automatic Rollback
        run: |
          # 1. Verify all stateful workloads (Postgres)
          kubectl rollout status statefulset -n ${{ env.NAMESPACE }} --timeout=60s

          # 2. Verify ALL deployments in namespace (redis, taskforge-web, etc.)
          kubectl rollout status deployment -n ${{ env.NAMESPACE }} --timeout=180s || {
            echo "Staging deployment failed! Rolling back taskforge-web..."
            kubectl rollout undo deployment/taskforge-web -n ${{ env.NAMESPACE }}
            kubectl rollout status deployment/taskforge-web -n ${{ env.NAMESPACE }} --timeout=120s
            exit 1
          }

          kubectl get pods,services -n ${{ env.NAMESPACE }}

      # Staging passed health checks -> Publish as official Pre-Release (Production Candidate)
      - name: "Publish as Production-Eligible Pre-Release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.TARGET_VERSION }}
          RELEASE_ID: ${{ env.RELEASE_ID }}
        run: |
          echo "Staging rollout verified! Publishing '${TAG}' as official Pre-Release (Eligible for Production)..."
          TARGET_ID="${RELEASE_ID}"
          if [ -z "${TARGET_ID}" ]; then
            TARGET_ID=$(curl -s -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/releases | jq -r ".[] | select(.tag_name==\"${TAG}\") | .id" | head -n 1)
          fi

          if [ -z "${TARGET_ID}" ]; then
            echo "::error::Release for tag '${TAG}' was not found! Upstream Stage 1 draft release is missing."
            exit 1
          fi

          curl -fsSL -X PATCH \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/releases/${TARGET_ID} \
            -d "{\"name\":\"${TAG} (Release Candidate)\",\"draft\":false,\"prerelease\":true,\"make_latest\":\"false\"}"
          echo "Successfully published ${TAG} (Release ID: ${TARGET_ID}) as Pre-Release (eligible for Production)!"

      - name: Trigger Production Release Pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.TARGET_VERSION }}
        run: |
          echo "Staging verified! Triggering Production Release for '${TAG}'..."
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/release-pipeline.yaml/dispatches \
            -d "{\"ref\":\"main\",\"inputs\":{\"version\":\"${TAG}\"}}"
