name: Dev Deployment

on:
  workflow_call:
    inputs:
      version:
        description: 'SemVer container image tag'
        required: true
        type: string

permissions:
  contents: read

jobs:
  dev-plan:
    name: "🧪 Dev: Kustomize Plan"
    runs-on: infra
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          clean: true

      - name: Preview Dev Manifests with Version
        run: |
          DOCKER_USER="${{ vars.DOCKER_USERNAME || 'shubhszone' }}"
          echo "=== Previewing Dev Manifests for ${{ inputs.version }} ==="
          cd k8s/overlays/dev
          kustomize edit set image taskforge=${DOCKER_USER}/taskforge:${{ inputs.version }}
          kubectl kustomize .

  dev-approval:
    name: "🧪 Dev: Deployment Approval Gate"
    needs: dev-plan
    runs-on: ubuntu-latest
    environment:
      name: approval-dev
    steps:
      - name: Dev Deployment Approved
        run: |
          echo "Approved deployment of version ${{ inputs.version }} to Dev."

  deploy-dev:
    name: "🧪 Dev: Deploy to Dev"
    needs: dev-approval
    runs-on: infra
    environment:
      name: dev
    env:
      NAMESPACE: taskforge-dev
      DEPLOY_ENV: dev
      DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME || 'shubhszone' }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      TARGET_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          clean: true

      - name: Ensure Dev Namespace Exists
        run: kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Inject Kubernetes Secrets
        run: |
          kubectl create secret generic taskforge-secrets \
            --namespace=${{ env.NAMESPACE }} \
            --from-literal=POSTGRES_PASSWORD="${{ env.POSTGRES_PASSWORD }}" \
            --from-literal=DATABASE_URL="postgres://taskforge:${{ env.POSTGRES_PASSWORD }}@postgres:5432/taskforge" \
            --from-literal=REDIS_URL="redis://redis:6379" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Set Dev Overlay Image Tag
        run: |
          cd k8s/overlays/${{ env.DEPLOY_ENV }}
          kustomize edit set image taskforge=${{ env.DOCKER_USERNAME }}/taskforge:${{ env.TARGET_VERSION }}

      - name: Deploy to Dev
        run: |
          kubectl apply -k k8s/overlays/${{ env.DEPLOY_ENV }}

      - name: Verify Dev Rollout with Automatic Rollback
        run: |
          kubectl rollout status statefulset -n ${{ env.NAMESPACE }} --timeout=60s
          kubectl rollout status deployment -n ${{ env.NAMESPACE }} --timeout=120s || {
            echo "Dev deployment failed! Rolling back taskforge-web..."
            kubectl rollout undo deployment/taskforge-web -n ${{ env.NAMESPACE }}
            kubectl rollout status deployment/taskforge-web -n ${{ env.NAMESPACE }} --timeout=120s
            exit 1
          }
          kubectl get pods,services -n ${{ env.NAMESPACE }}
