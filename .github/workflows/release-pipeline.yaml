name: Production Release

on:

  workflow_call:
    inputs:
      version:
        description: 'SemVer release tag to deploy to Production (leave empty for latest Pre-Release)'
        required: true
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer release tag to deploy to Production (leave empty for latest Pre-Release)'
        required: true
        type: string
        default: ''

permissions:
  contents: write
  actions: write

jobs:
  preflight:
    name: "Pre flight checks"
    runs-on: ubuntu-latest
    steps:
      - name: Validate Pre-Release Eligibility
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.version }}
        run: |
          echo "Validating that tag '${TAG}' has an active Pre-Release before Production rollout..."
          HTTP_STATUS=$(curl -s -o /tmp/release.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG})

          if [ "${HTTP_STATUS}" != "200" ]; then
            echo "::error::No GitHub Release found for tag '${TAG}' (HTTP ${HTTP_STATUS}). Only tags with an approved Pre-Release can be deployed to Production."
            exit 1
          fi

          IS_PRERELEASE=$(jq -r '.prerelease // false' /tmp/release.json)
          if [ "${IS_PRERELEASE}" != "true" ]; then
            echo "::error::Release for tag '${TAG}' is NOT marked as a Pre-Release (prerelease: true). Only verified Pre-Releases from Staging are eligible for Production."
            exit 1
          fi

          echo "Validation passed: Tag '${TAG}' is a confirmed Pre-Release eligible for Production."

  prod-deploy:
    name: "🚀 Production Deployment"
    needs: preflight
    uses: ./.github/workflows/reusable-deploy.yaml
    with:
      env: prod
      version: ${{ inputs.version }}
      approval_env: approval-prod
      runner: infra-prod
      promote_to_latest: true
    secrets: inherit

  promote-release:
    name: "🌟 Promote to Official Latest Release"
    needs: prod-deploy
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.version }}
    steps:
      - name: Promote Release Candidate to Official Latest Release
        run: |
          echo "Production rollout verified! Promoting '${TAG}' to Official Latest Release..."
          RELEASE_ID=$(curl -s -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG} | jq -r '.id // empty')

          if [ -n "${RELEASE_ID}" ]; then
            curl -fsSL -X PATCH \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID} \
              -d "{\"name\":\"${TAG}\",\"draft\":false,\"prerelease\":false,\"make_latest\":\"true\"}"
            echo "Successfully promoted ${TAG} (Release ID: ${RELEASE_ID}) to Official Latest Release!"
          else
            echo "Warning: GitHub release for tag '${TAG}' not found to update."
          fi
