name: Production Release

on:

  workflow_call:
    inputs:
      version:
        description: 'SemVer release tag to deploy to Production (leave empty for latest Pre-Release)'
        required: true
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer release tag to deploy to Production (leave empty for latest Pre-Release)'
        required: true
        type: string
        default: ''

permissions:
  contents: write

jobs:
  prod-deploy:
    name: "🚀 Production Deployment"
    uses: ./.github/workflows/reusable-deploy.yaml
    with:
      env: prod
      version: ${{ inputs.version }}
      runner: infra-prod
      promote_to_latest: true
    secrets: inherit
