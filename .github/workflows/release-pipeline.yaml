name: Release Pipeline | Build Once, Deploy Everywhere

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'k8s/**'
      - 'Dockerfile'
      - '.github/workflows/release-pipeline.yaml'
  workflow_dispatch:
    inputs:
      manual_version:
        description: 'Optional manual SemVer tag (e.g. v1.0.1). Leave empty for automated semantic-release calculation.'
        required: false
        default: '' 
 
permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  # =========================================================================
  # STAGE 1: Calculate Official SemVer via cycjimmy & Build Artifact ONCE
  # =========================================================================
  build-and-release:
    name: Build Once & SemVer Release
    runs-on: ubuntu-latest
    environment:
      name: dev
    outputs:
      version: ${{ steps.version_step.outputs.version }}
      should_deploy: ${{ steps.version_step.outputs.should_deploy }}
    steps:
      - name: Checkout Code with Full Git History
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Official Semantic Release on main (tags Git, generates GitHub Release & Changelog)
      - name: Run Semantic Release
        id: semantic
        if: ${{ github.event.inputs.manual_version == '' }}
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            @semantic-release/github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Determine the resolved release version
      - name: Resolve Version
        id: version_step
        run: |
          if [ -n "${{ github.event.inputs.manual_version }}" ]; then
            TAG="${{ github.event.inputs.manual_version }}"
            echo "version=${TAG}" >> $GITHUB_OUTPUT
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "Target Version (Manual): ${TAG}"
          elif [ "${{ steps.semantic.outputs.new_release_published }}" = "true" ]; then
            TAG="${{ steps.semantic.outputs.new_release_git_tag }}"
            echo "version=${TAG}" >> $GITHUB_OUTPUT
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "Target Version (Automated SemVer): ${TAG}"
          else
            echo "No new release published by semantic-release (no relevant conventional commits)."
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        if: steps.version_step.outputs.should_deploy == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.version_step.outputs.should_deploy == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: steps.version_step.outputs.should_deploy == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT_TOKEN }}
 
      # Build and push the immutable container image ONCE with official SemVer
      - name: Build and Push Docker Image
        if: steps.version_step.outputs.should_deploy == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ vars.DOCKER_USERNAME }}/taskforge:${{ steps.version_step.outputs.version }}

  # =========================================================================
  # STAGE 2: Dev Manifest Preview, Approval, and Deployment
  # =========================================================================
  dev-plan:
    name: "🧪 Dev: Kustomize Plan (Dry Run)"
    needs: build-and-release
    if: needs.build-and-release.outputs.should_deploy == 'true'
    runs-on: infra
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          clean: true

      - name: Preview Dev Manifests with Version
        run: |
          echo "=== Previewing Dev Manifests for ${{ needs.build-and-release.outputs.version }} ==="
          cd k8s/overlays/dev
          kustomize edit set image taskforge=${{ vars.DOCKER_USERNAME }}/taskforge:${{ needs.build-and-release.outputs.version }}
          kubectl kustomize .

  dev-approval:
    name: "🧪 Dev: Deployment Approval Gate"
    needs: [build-and-release, dev-plan]
    runs-on: ubuntu-latest
    environment:
      name: approval-env
    steps:
      - name: Dev Deployment Approved
        run: |
          echo "Approved deployment of version ${{ needs.build-and-release.outputs.version }} to Dev."

  deploy-dev:
    name: "🧪 Dev: Deploy to Dev"
    needs: [build-and-release, dev-approval]
    runs-on: infra
    environment:
      name: dev
    env:
      NAMESPACE: taskforge-dev
      DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      TARGET_VERSION: ${{ needs.build-and-release.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          clean: true

      - name: Ensure Dev Namespace Exists
        run: kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Inject Kubernetes Secrets
        run: |
          kubectl create secret generic taskforge-secrets \
            --namespace=${{ env.NAMESPACE }} \
            --from-literal=POSTGRES_PASSWORD="${{ env.POSTGRES_PASSWORD }}" \
            --from-literal=DATABASE_URL="postgres://taskforge:${{ env.POSTGRES_PASSWORD }}@postgres:5432/taskforge" \
            --from-literal=REDIS_URL="redis://redis:6379" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Set Dev Overlay Image Tag to SemVer
        run: |
          cd k8s/overlays/dev
          kustomize edit set image taskforge=${{ env.DOCKER_USERNAME }}/taskforge:${{ env.TARGET_VERSION }}

      - name: Deploy to Dev
        run: |
          kubectl apply -k k8s/overlays/dev

      - name: Verify Dev Rollout
        run: |
          kubectl rollout status statefulset/postgres -n ${{ env.NAMESPACE }} --timeout=60s
          kubectl rollout status deployment/taskforge-web -n ${{ env.NAMESPACE }} --timeout=120s
          kubectl get pods,services -n ${{ env.NAMESPACE }}

  staging-plan:
    name: "🎯 Staging: Kustomize Plan (Dry Run)"
    needs: [build-and-release, deploy-dev]
    runs-on: infra
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          clean: true

      - name: Preview Staging Manifests with Version
        run: |
          echo "=== Previewing Staging Manifests for ${{ needs.build-and-release.outputs.version }} ==="
          cd k8s/overlays/staging
          kustomize edit set image taskforge=${{ vars.DOCKER_USERNAME }}/taskforge:${{ needs.build-and-release.outputs.version }}
          kubectl kustomize .

  staging-approval:
    name: "🎯 Staging: Promotion Approval Gate"
    needs: [build-and-release, staging-plan]
    runs-on: ubuntu-latest
    environment:
      name: approval-env
    steps:
      - name: Staging Promotion Approved
        run: |
          echo "Approved promotion of version ${{ needs.build-and-release.outputs.version }} to Staging."

  deploy-staging:
    name: "🎯 Staging: Promote to Staging"
    needs: [build-and-release, staging-approval]
    runs-on: infra
    environment:
      name: staging
    env:
      NAMESPACE: taskforge-staging
      DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      TARGET_VERSION: ${{ needs.build-and-release.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          clean: true

      - name: Ensure Staging Namespace Exists
        run: kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Inject Kubernetes Secrets
        run: |
          kubectl create secret generic taskforge-secrets \
            --namespace=${{ env.NAMESPACE }} \
            --from-literal=POSTGRES_PASSWORD="${{ env.POSTGRES_PASSWORD }}" \
            --from-literal=DATABASE_URL="postgres://taskforge:${{ env.POSTGRES_PASSWORD }}@postgres:5432/taskforge" \
            --from-literal=REDIS_URL="redis://redis:6379" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Set Staging Overlay Image Tag to EXACT Same SemVer
        run: |
          cd k8s/overlays/staging
          kustomize edit set image taskforge=${{ env.DOCKER_USERNAME }}/taskforge:${{ env.TARGET_VERSION }}

      - name: Deploy to Staging
        run: |
          kubectl apply -k k8s/overlays/staging

      - name: Verify Staging Rollout with Automatic Rollback
        run: |
          kubectl rollout status statefulset/postgres -n ${{ env.NAMESPACE }} --timeout=60s
          kubectl rollout status deployment/taskforge-web -n ${{ env.NAMESPACE }} --timeout=180s || {
            echo "Staging deployment failed! Rolling back to previous revision..."
            kubectl rollout undo deployment/taskforge-web -n ${{ env.NAMESPACE }}
            exit 1
          }
          kubectl get pods,services -n ${{ env.NAMESPACE }}


  # =========================================================================
  # STAGE 3: Prod Manifest Preview, Approval, and Promotion (EXACT SAME Artifact)
  # =========================================================================
  prod-plan:
    name: "🚀 Prod: Kustomize Plan (Dry Run)"
    needs: [build-and-release, deploy-staging]
    runs-on: infra
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          clean: true

      - name: Preview Prod Manifests with Version
        run: |
          echo "=== Previewing Prod Manifests for ${{ needs.build-and-release.outputs.version }} ==="
          cd k8s/overlays/prod
          kustomize edit set image taskforge=${{ vars.DOCKER_USERNAME }}/taskforge:${{ needs.build-and-release.outputs.version }}
          kubectl kustomize .

  prod-approval:
    name: "🚀 Prod: Promotion Approval Gate"
    needs: [build-and-release, prod-plan]
    runs-on: ubuntu-latest
    environment:
      name: approval-env
    steps:
      - name: Prod Promotion Approved
        run: |
          echo "Approved promotion of version ${{ needs.build-and-release.outputs.version }} to Production."

  deploy-prod:  
    name: "🚀 Prod: Promote to Production"
    needs: [build-and-release, prod-approval]
    runs-on: infra
    environment:
      name: prod
    env:
      NAMESPACE: taskforge-prod
      DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      TARGET_VERSION: ${{ needs.build-and-release.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          clean: true

      - name: Ensure Prod Namespace Exists
        run: kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Inject Kubernetes Secrets
        run: |
          kubectl create secret generic taskforge-secrets \
            --namespace=${{ env.NAMESPACE }} \
            --from-literal=POSTGRES_PASSWORD="${{ env.POSTGRES_PASSWORD }}" \
            --from-literal=DATABASE_URL="postgres://taskforge:${{ env.POSTGRES_PASSWORD }}@postgres:5432/taskforge" \
            --from-literal=REDIS_URL="redis://redis:6379" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Set Prod Overlay Image Tag to EXACT Same SemVer
        run: |
          cd k8s/overlays/prod
          kustomize edit set image taskforge=${{ env.DOCKER_USERNAME }}/taskforge:${{ env.TARGET_VERSION }}

      - name: Deploy to Production
        run: |
          kubectl apply -k k8s/overlays/prod

      - name: Verify Prod Rollout with Automatic Rollback
        run: |
          kubectl rollout status statefulset/postgres -n ${{ env.NAMESPACE }} --timeout=60s
          kubectl rollout status deployment/taskforge-web -n ${{ env.NAMESPACE }} --timeout=180s || {
            echo "Production deployment failed! Rolling back to previous revision..."
            kubectl rollout undo deployment/taskforge-web -n ${{ env.NAMESPACE }}
            exit 1
          }
          kubectl get pods,services -n ${{ env.NAMESPACE }}
