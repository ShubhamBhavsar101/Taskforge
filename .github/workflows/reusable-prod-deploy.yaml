name: Production Deployment

on:
  workflow_call:
    inputs:
      version:
        description: 'SemVer release tag to deploy to Production (leave empty for latest Pre-Release)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  preflight:
    name: "Pre flight checks"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve_version.outputs.version }}
    steps:
      - name: Resolve and Validate Pre-Release Eligibility
        id: resolve_version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          TAG="${INPUT_VERSION}"

          # If empty manual input, discover the latest Pre-Release candidate
          if [ -z "${TAG}" ]; then
            echo "No explicit version provided. Querying GitHub for the latest active Pre-Release candidate..."
            TAG=$(curl -s -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/releases | jq -r '.[] | select(.prerelease == true) | .tag_name' | head -n 1)
          fi

          if [ -z "${TAG}" ] || [ "${TAG}" = "null" ]; then
            echo "::error::Could not determine an eligible Pre-Release tag to deploy to Production."
            exit 1
          fi

          echo "Validating that tag '${TAG}' has an active Pre-Release before Production rollout..."
          HTTP_STATUS=$(curl -s -o /tmp/release.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG})

          if [ "${HTTP_STATUS}" != "200" ]; then
            echo "::error::No GitHub Release found for tag '${TAG}' (HTTP ${HTTP_STATUS}). Only tags with an approved Pre-Release can be deployed to Production."
            exit 1
          fi

          IS_PRERELEASE=$(jq -r '.prerelease // false' /tmp/release.json)
          if [ "${IS_PRERELEASE}" != "true" ]; then
            echo "::error::Release for tag '${TAG}' is NOT marked as a Pre-Release (prerelease: true). Only verified Pre-Releases from Staging are eligible for Production."
            exit 1
          fi

          echo "Validation passed: Tag '${TAG}' is a confirmed Pre-Release eligible for Production."
          echo "version=${TAG}" >> $GITHUB_OUTPUT

  prod-plan:
    name: "🚀 Prod: Kustomize Plan"
    needs: preflight
    runs-on: infra-prod
    steps:
      - name: Checkout Code at Specified Version
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.version }}
          clean: true

      - name: Preview Prod Manifests with Version
        run: |
          DOCKER_USER="${{ vars.DOCKER_USERNAME || 'shubhszone' }}"
          TARGET_VERSION="${{ needs.preflight.outputs.version }}"
          echo "=== Previewing Prod Manifests for ${TARGET_VERSION} ==="
          cd k8s/overlays/prod
          kustomize edit set image taskforge=${DOCKER_USER}/taskforge:${TARGET_VERSION}
          kubectl kustomize .

  deploy-prod:
    name: "🚀 Prod: Deploy to Production & Promote"
    needs: [preflight, prod-plan]
    runs-on: infra-prod
    environment:
      name: prod
    env:
      NAMESPACE: taskforge-prod
      DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME || 'shubhszone' }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      TARGET_VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - name: Checkout Code at Specified Version
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_VERSION }}
          clean: true

      - name: Ensure Prod Namespace Exists
        run: kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Inject Kubernetes Secrets
        run: |
          kubectl create secret generic taskforge-secrets \
            --namespace=${{ env.NAMESPACE }} \
            --from-literal=POSTGRES_PASSWORD="${{ env.POSTGRES_PASSWORD }}" \
            --from-literal=DATABASE_URL="postgres://taskforge:${{ env.POSTGRES_PASSWORD }}@postgres:5432/taskforge" \
            --from-literal=REDIS_URL="redis://redis:6379" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Set Prod Overlay Image Tag
        run: |
          cd k8s/overlays/prod
          kustomize edit set image taskforge=${{ env.DOCKER_USERNAME }}/taskforge:${{ env.TARGET_VERSION }}

      - name: Deploy to Production
        run: |
          kubectl apply -k k8s/overlays/prod

      - name: Verify Prod Rollout with Automatic Rollback
        run: |
          # 1. Verify stateful workloads
          kubectl rollout status statefulset -n ${{ env.NAMESPACE }} --timeout=60s

          # 2. Verify all deployments across namespace with automatic rollback
          kubectl rollout status deployment -n ${{ env.NAMESPACE }} --timeout=180s || {
            echo "Production deployment failed! Rolling back taskforge-web..."
            kubectl rollout undo deployment/taskforge-web -n ${{ env.NAMESPACE }}
            kubectl rollout status deployment/taskforge-web -n ${{ env.NAMESPACE }} --timeout=120s
            exit 1
          }
          kubectl get pods,services -n ${{ env.NAMESPACE }}

      - name: Promote Release Candidate to Official Latest Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.TARGET_VERSION }}
        run: |
          echo "Promoting release candidate '${TAG}' to Official Latest Release..."
          RELEASE_ID=$(curl -s -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/releases/tags/${TAG} | jq -r '.id // empty')

          if [ -n "${RELEASE_ID}" ]; then
            curl -fsSL -X PATCH \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID} \
              -d "{\"name\":\"${TAG}\",\"draft\":false,\"prerelease\":false,\"make_latest\":\"true\"}"
            echo "Successfully promoted ${TAG} (Release ID: ${RELEASE_ID}) to Official Latest Release!"
          else
            echo "Warning: GitHub release for tag '${TAG}' not found to update."
          fi
