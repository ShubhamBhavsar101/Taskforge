name: "PR Title Check"

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  pull-requests: read

jobs:
  validate-pr-title: 
    name: Validate PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Validate Source Branch Prefix
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          echo "PR Source Branch: ${BRANCH_NAME}"
          if [[ ! "${BRANCH_NAME}" =~ ^feature/ ]]; then
            echo "::error::Pull Requests targeting 'main' must originate from a 'feature/' branch! Received: '${BRANCH_NAME}'"
            exit 1
          fi
          echo "Branch name '${BRANCH_NAME}' is valid."
          
      - name: Validate Conventional Commit PR Title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            fix
            feat
            feat!
            NOJIRA
            chore
          subjectPattern: ^(?![A-Z]).+$

