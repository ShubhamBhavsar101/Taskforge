name: App Build | Dev
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - src/**

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    environment: 
      name: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: DEBUG
        run: |
          echo "DEBUG: DOCKER_USERNAME=${{ vars.DOCKER_USERNAME }}"
          echo "DEBUG: DOCKER_PAT_TOKEN=${{ secrets.DOCKER_PAT_TOKEN }}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          # registry: ghcr.io
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT_TOKEN }}
      
      - name: Build and push the Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ vars.DOCKER_USERNAME }}/taskforge:latest

  deploy:
    needs: build
    name: Deploy to Local Kind Cluster
    runs-on: infra-dev
    environment:
      name: dev
    env:
      DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          clean: true

      - name: DEBUG
        run: pwd
      
      - name: Docker Compose test
        run: docker compose up

          
    