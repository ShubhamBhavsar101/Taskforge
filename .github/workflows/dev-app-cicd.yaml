name: App PR Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'k8s/**'

jobs:
  validate-build:
    name: Build & Test (Dry Run)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Verify the Dockerfile builds cleanly without pushing to registry
      - name: Test Docker Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: taskforge:test

  validate-manifests:
    name: Validate K8s Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test Dev Kustomize Build
        run: |
          kubectl kustomize k8s/overlays/dev > /dev/null
          echo "Dev overlays build cleanly."

      - name: Test Prod Kustomize Build
        run: |
          kubectl kustomize k8s/overlays/prod > /dev/null
          echo "Prod overlays build cleanly."