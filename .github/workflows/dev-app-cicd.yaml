name: App Build | Dev
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - src/**

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    environment: 
      name: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: DEBUG
        run: |
          echo "DEBUG: DOCKER_USERNAME=${{ vars.DOCKER_USERNAME }}"
          echo "DEBUG: DOCKER_PAT_TOKEN=${{ secrets.DOCKER_PAT_TOKEN }}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT_TOKEN }}
      
      - name: Build and push the Docker image
        uses: docker/build-push-action@v6 
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ vars.DOCKER_USERNAME }}/taskforge:latest
  
  approval:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: approval-env
    steps:
      - name: Manual Approval
        run: echo "This is Approved"

  deploy:
    needs: approval
    name: Deploy to Local Kind Cluster
    runs-on: infra-dev
    environment:
      name: dev
    env:
      DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      NAMESPACE: taskforge-dev
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          clean: true
      
      - name: Create Namespace
        run: kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Inject Kubernetes Secrets
        run: |
          kubectl create secret generic taskforge-secrets \
            --namespace=${{ env.NAMESPACE }} \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --from-literal=DATABASE_URL="postgres://taskforge:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/taskforge" \
            --from-literal=REDIS_URL="redis://redis:6379" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -k k8s/overlays/dev

      - name: Verify Deployment Status
        run: |
          kubectl get pods,services -n taskforge-dev

          
    