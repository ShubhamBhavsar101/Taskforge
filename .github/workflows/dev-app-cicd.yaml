name: Dev Pipeline | PR Build & Deploy

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'k8s/**'
      - 'Dockerfile'
      - '.github/workflows/dev-app-cicd.yaml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # =========================================================================
  # STAGE 1: Calculate SemVer with -dev-{shortsha} suffix & Build Dev Image
  # =========================================================================
  build:
    name: Build and Push Dev Image
    runs-on: ubuntu-26.04-arm
    environment:
      name: dev 
    outputs:
      version: ${{ steps.version_step.outputs.version }}
      docker_username: ${{ vars.DOCKER_USERNAME || 'shubhszone' }}
    steps:
      - name: Checkout Code with Full History
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Calculate next semantic version from git commit messages
      - name: Calculate Base Semantic Version
        id: semver
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: "BREAKING CHANGE:|feat!:"
          minor_pattern: "feat:"
          version_format: "${major}.${minor}.${patch}"

      # Construct Image Tag (x.x.x-dev-{shortsha})
      - name: Construct Version Identifiers
        id: version_step
        run: |
          SHORT_SHA=$(echo "${{ github.event.pull_request.head.sha || github.sha }}" | cut -c1-7)
          BASE_VERSION="${{ steps.semver.outputs.version }}"
          IMAGE_TAG="${BASE_VERSION}-dev-${SHORT_SHA}"
          echo "version=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "Docker Image Tag: ${IMAGE_TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT_TOKEN }}

      - name: Build and Push Dev Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/arm64
          tags: |
            ${{ vars.DOCKER_USERNAME || 'shubhszone' }}/taskforge:${{ steps.version_step.outputs.version }}

  # =========================================================================
  # STAGE 2: Dev Manifest Preview & Approval Gate
  # =========================================================================
  dev-deploy:
    name: "🧪 Dev Deployment"
    needs: build
    uses: ./.github/workflows/reusable-deploy.yaml
    with:
      env: dev
      version: ${{ needs.build.outputs.version }}
      approval_env: approval-dev
      runner: infra
    secrets: inherit
