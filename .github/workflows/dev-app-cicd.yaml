name: App Build | Dev
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - src/**

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    environment: 
      name: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: DEBUG
        run: |
          echo "DEBUG: DOCKER_USERNAME=${{ vars.DOCKER_USERNAME }}"
          echo "DEBUG: DOCKER_PAT_TOKEN=${{ secrets.DOCKER_PAT_TOKEN }}"
          
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT_TOKEN }}
      
      - name: Build and push the Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/${{ vars.DOCKER_USERNAME }}/taskforge:latest
    