apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: taskforge-prod

resources:
  - namespace.yaml
  - ../../base

patches:
  - path: replicas.yaml
  - path: ingress.yaml

images:
  - name: taskforge
    newName: shubhszone/taskforge
    newTag: v1.0.0

generatorOptions:
  disableNameSuffixHash: true
