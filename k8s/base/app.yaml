apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskforge-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskforge-web
  template:
    metadata:
      labels:
        app: taskforge-web
    spec:
      containers:
        - name: web
          image: taskforge
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: taskforge-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: taskforge-secrets
                  key: REDIS_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/live
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
--- 
apiVersion: v1
kind: Service
metadata:
  name: taskforge-web
spec:
  selector:
    app: taskforge-web
  ports:
    - port: 3000
      targetPort: 3000
