services:
  web:
    build: .
    container_name: taskforge-web-1
    hostname: taskforge-web-1
    environment:
      - PORT=3000
      - CONTAINER_NAME=taskforge-web-1
      - DATABASE_URL=postgres://taskforge:taskforge@postgres:5432/taskforge
      - REDIS_URL=redis://redis:6379
      - POSTGRES_CONTAINER_NAME=taskforge-postgres-1
      - REDIS_CONTAINER_NAME=taskforge-redis-1
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    container_name: taskforge-postgres-1
    environment:
      POSTGRES_DB: taskforge
      POSTGRES_USER: taskforge
      POSTGRES_PASSWORD: taskforge
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: taskforge-redis-1
    ports:
      - "${REDIS_PORT:-6379}:6379"

volumes:
  pgdata:
